name: Deploy

# Pushes to main deploy. A manual run from the Actions tab is the only other way in.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave: rsync --delete on a shared target is not
# safe to run concurrently. Queue instead of cancelling, so the last push wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to dhosting
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Eleventy wraps the two hand-written pages in the shared layout
      # (src/_includes/base.njk) and copies the generator pages' vendored
      # markup through untouched. Output lands in site/, which isn't
      # committed.
      - name: Build the site
        run: npm run build

      - name: Validate the HTML
        run: npx --yes html-validate@11 site/index.html site/en/index.html

      # The PostHog project key lives in a secret, not in git. Fail rather than
      # deploy a site that silently records nothing. Every page under site/
      # gets the snippet (see src/_includes/base.njk and
      # scripts/inject-analytics.js), so the placeholder is replaced everywhere.
      - name: Insert the PostHog project key
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: |
          test -n "$POSTHOG_PROJECT_KEY" || { echo "POSTHOG_PROJECT_KEY secret is not set"; exit 1; }
          grep -rl "__POSTHOG_PROJECT_KEY__" site --include='*.html' -Z | xargs -0 sed -i "s/__POSTHOG_PROJECT_KEY__/$POSTHOG_PROJECT_KEY/"
          ! grep -rq "__POSTHOG_PROJECT_KEY__" site --include='*.html'

      - name: Configure the SSH client
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload site/ to ~/michalkulbacki.com/public_html
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --filter='P /.htaccess' \
            --filter='P /.well-known/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o IdentitiesOnly=yes" \
            site/ \
            "$DEPLOY_USER@$DEPLOY_HOST:michalkulbacki.com/public_html/"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
